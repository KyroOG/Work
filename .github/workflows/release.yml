name: Build Windows installer

# Push a tag like v1.0.0 and this builds Work-Setup-1.0.0.exe and attaches it to a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: desktop
        run: npm install
      - name: Build installer
        working-directory: desktop
        run: npm run dist
      - name: Upload to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/Work-Setup-*.exe
          generate_release_notes: true
      - name: Keep the installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Work-Setup
          path: desktop/dist/Work-Setup-*.exe
